name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n setup/setup-linux.sh
          bash -n setup/setup-mac.sh
